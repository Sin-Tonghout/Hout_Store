<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Admin</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <aside id="admin-sidebar" class="bg-slate-900 md:fixed md:inset-y-0 md:left-0 md:z-30 md:w-60 md:overflow-y-auto"></aside>

  <div class="md:pl-60">
    <header id="admin-topbar" class="sticky top-0 z-20 border-b border-slate-200 bg-white"></header>

    <main class="p-4 md:p-8">
      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 id="greeting" class="text-2xl font-bold text-slate-900">Dashboard</h1>
          <p id="welcome" class="mt-1 text-sm text-slate-500">Loading...</p>
        </div>
        <div class="flex gap-3">
          <a href="/admin/products/new" class="btn-primary inline-block">Add product</a>
          <a href="/admin/categories" class="btn-secondary">Manage categories</a>
        </div>
      </div>

      <div id="dash-error" class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>

      <!-- Stat cards -->
      <div id="stats" class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>

      <!-- Sales chart + top products -->
      <div class="mt-6 grid gap-6 lg:grid-cols-3">
        <section class="min-w-0 rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-2">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h2 class="font-semibold text-slate-900">Sales, last 7 days</h2>
              <p class="text-xs text-slate-500">Paid orders only</p>
            </div>
            <p id="chart-total" class="text-lg font-bold text-slate-900"></p>
          </div>
          <div id="chart" class="mt-6 flex h-48 items-end gap-2"></div>
        </section>

        <section class="min-w-0 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="font-semibold text-slate-900">Top products</h2>
          <p class="text-xs text-slate-500">By number sold</p>
          <div id="top-products" class="mt-3"></div>
        </section>
      </div>

      <!-- Recent orders + payment activity -->
      <div class="mt-6 grid gap-6 lg:grid-cols-3">
        <section class="min-w-0 rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-2">
                    <div class="flex items-center justify-between">
            <h2 class="font-semibold text-slate-900">Recent orders</h2>
            <a href="/admin/orders" class="text-sm font-medium text-indigo-600 hover:underline">View all</a>
          </div>
          <div id="recent-orders" class="mt-3 overflow-x-auto"></div>
        </section>

        <section class="min-w-0 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="font-semibold text-slate-900">Payment activity</h2>
          <div id="recent-payments" class="mt-3"></div>
        </section>
      </div>

      <!-- Recent customers + products overview -->
      <div class="mt-6 grid gap-6 lg:grid-cols-3">
        <section class="min-w-0 rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-2">
          <h2 class="font-semibold text-slate-900">Recent customers</h2>
          <div id="recent-customers" class="mt-3 overflow-x-auto"></div>
        </section>

        <section class="min-w-0 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="font-semibold text-slate-900">Products overview</h2>
          <div id="products-overview" class="mt-4 space-y-4"></div>
          <a href="/admin/products" class="mt-5 inline-block text-sm font-medium text-indigo-600 hover:underline">Manage products</a>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/js/admin/layout.js"></script>
  <script type="module" src="/js/admin/dashboard.js"></script>
</body>
</html>
