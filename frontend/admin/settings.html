<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Admin</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <aside id="admin-sidebar" class="bg-slate-900 md:fixed md:inset-y-0 md:left-0 md:z-30 md:w-60 md:overflow-y-auto"></aside>

  <div class="md:pl-60">
    <header id="admin-topbar" class="sticky top-0 z-20 border-b border-slate-200 bg-white"></header>

    <main class="p-4 md:p-8">
      <h1 class="text-2xl font-bold text-slate-900">Store Settings</h1>
      <p class="mt-1 text-sm text-slate-500">These values appear on receipts and control digital downloads.</p>

      <div id="settings-error" class="mt-4 hidden max-w-xl rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>

      <form id="settings-form" class="mt-6 max-w-xl space-y-6" novalidate>
        <section class="rounded-xl border border-slate-200 bg-white p-6">
          <h2 class="font-semibold text-slate-900">Store</h2>
          <div class="mt-4 space-y-4">
            <div>
              <label for="store_name" class="form-label">Store name *</label>
              <input id="store_name" type="text" maxlength="150" class="form-input" />
            </div>
            <div>
              <label for="store_tagline" class="form-label">Tagline</label>
              <input id="store_tagline" type="text" maxlength="200" class="form-input" />
            </div>
            <div>
              <label for="receipt_footer" class="form-label">Receipt footer</label>
              <input id="receipt_footer" type="text" maxlength="300" class="form-input" />
            </div>
          </div>
        </section>

        <section class="rounded-xl border border-slate-200 bg-white p-6">
          <h2 class="font-semibold text-slate-900">Downloads</h2>
          <div class="mt-4 grid gap-4 sm:grid-cols-2">
            <div>
              <label for="download_max_count" class="form-label">Max downloads per purchase</label>
              <input id="download_max_count" type="number" min="1" max="100" class="form-input" />
            </div>
            <div>
              <label for="download_expiry_days" class="form-label">Link expiry (days)</label>
              <input id="download_expiry_days" type="number" min="1" max="365" class="form-input" />
            </div>
          </div>
          <p class="mt-2 text-xs text-slate-500">Only applies to downloads generated after this is saved — existing links keep their original limits.</p>
        </section>

        <button type="submit" class="btn-primary">Save Settings</button>
      </form>
    </main>
  </div>

  <script type="module" src="/js/admin/layout.js"></script>
  <script type="module" src="/js/admin/settings.js"></script>
</body>
</html>
