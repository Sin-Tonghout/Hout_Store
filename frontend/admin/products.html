<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | Admin</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <aside id="admin-sidebar" class="bg-slate-900 md:fixed md:inset-y-0 md:left-0 md:z-30 md:w-60 md:overflow-y-auto"></aside>

  <div class="md:pl-60">
    <header id="admin-topbar" class="sticky top-0 z-20 border-b border-slate-200 bg-white"></header>

    <main class="p-4 md:p-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-2xl font-bold text-slate-900">Products</h1>
        <a href="/admin/products/new" class="btn-primary inline-block">Add product</a>
      </div>

      <div class="mt-6 grid gap-3 sm:grid-cols-3">
        <input id="filter-search" type="search" placeholder="Search name or slug" class="form-input mt-0" />
        <select id="filter-status" class="form-input mt-0">
          <option value="">All statuses</option>
          <option value="published">Published</option>
          <option value="draft">Draft</option>
          <option value="archived">Archived</option>
        </select>
        <select id="filter-category" class="form-input mt-0">
          <option value="">All categories</option>
        </select>
      </div>

      <!-- Only this box scrolls (up, down and sideways). The header row stays visible. -->
      <div class="mt-4 max-h-[calc(100vh-21rem)] min-h-64 overflow-auto rounded-xl border border-slate-200 bg-white">
        <table class="min-w-full text-sm">
          <thead class="sticky top-0 z-10 bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 shadow-[0_1px_0_#e2e8f0]">
            <tr>
              <th class="px-4 py-3">Product</th>
              <th class="px-4 py-3">Category</th>
              <th class="px-4 py-3">Price</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">File</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="product-rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <nav id="pagination" class="mt-4 flex items-center justify-center gap-3" aria-label="Pagination"></nav>
    </main>
  </div>

  <script type="module" src="/js/admin/layout.js"></script>
  <script type="module" src="/js/admin/products.js"></script>
</body>
</html>
