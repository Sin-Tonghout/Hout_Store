<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Admin</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <aside id="admin-sidebar" class="bg-slate-900 md:fixed md:inset-y-0 md:left-0 md:z-30 md:w-60 md:overflow-y-auto"></aside>

  <div class="md:pl-60">
    <header id="admin-topbar" class="sticky top-0 z-20 border-b border-slate-200 bg-white"></header>

    <main class="p-4 md:p-8">
      <div class="flex items-center gap-3">
        <button type="button" data-back data-fallback="/admin/dashboard"
          class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100">&larr; Back</button>
        <h1 class="text-2xl font-bold text-slate-900">Profile</h1>
      </div>

      <div class="mt-6 grid max-w-4xl gap-6 lg:grid-cols-3">
        <!-- Profile card -->
        <section class="min-w-0 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <div id="profile-card" class="text-center"></div>
        </section>

        <div class="min-w-0 space-y-6 lg:col-span-2">
          <!-- Change name -->
          <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="font-semibold text-slate-900">Your name</h2>
            <div id="name-error" class="mt-3 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>
            <form id="name-form" class="mt-4 space-y-4" novalidate>
              <div>
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" maxlength="100" class="form-input" />
              </div>
              <button type="submit" class="btn-primary">Save name</button>
            </form>
          </section>

          <!-- Change password -->
          <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="font-semibold text-slate-900">Change password</h2>
            <div id="password-error" class="mt-3 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>
            <form id="password-form" class="mt-4 space-y-4" novalidate>
              <div>
                <label for="current_password" class="form-label">Current password</label>
                <input id="current_password" type="password" autocomplete="current-password" class="form-input" />
              </div>
              <div>
                <label for="new_password" class="form-label">New password</label>
                <input id="new_password" type="password" autocomplete="new-password" class="form-input" />
                <p class="mt-1 text-xs text-slate-500">At least 8 characters, with a letter and a number.</p>
              </div>
              <div>
                <label for="confirm_password" class="form-label">Confirm new password</label>
                <input id="confirm_password" type="password" autocomplete="new-password" class="form-input" />
              </div>
              <button type="submit" class="btn-primary">Change password</button>
            </form>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/admin/layout.js"></script>
  <script type="module" src="/js/admin/profile.js"></script>
</body>
</html>
