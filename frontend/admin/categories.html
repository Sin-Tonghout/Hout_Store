<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories | Admin</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <aside id="admin-sidebar" class="bg-slate-900 md:fixed md:inset-y-0 md:left-0 md:z-30 md:w-60 md:overflow-y-auto"></aside>

  <div class="md:pl-60">
    <header id="admin-topbar" class="sticky top-0 z-20 border-b border-slate-200 bg-white"></header>

    <main class="p-4 md:p-8">
      <h1 class="text-2xl font-bold text-slate-900">Categories</h1>

      <!-- Table on the left, form on the right (form goes on top on small screens) -->
      <div class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_20rem]">

        <!-- Table: only this box scrolls (up, down and sideways). The header row stays visible. -->
        <div class="order-2 max-h-[calc(100vh-13rem)] min-h-64 overflow-auto rounded-xl border border-slate-200 bg-white lg:order-1">
          <table class="min-w-full text-sm">
            <thead class="sticky top-0 z-10 bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 shadow-[0_1px_0_#e2e8f0]">
              <tr>
                <th class="px-4 py-3">Name</th>
                <th class="px-4 py-3">Slug</th>
                <th class="px-4 py-3">Parent</th>
                <th class="px-4 py-3">Products</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="category-rows" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>

        <!-- Form: one field per row -->
        <section class="order-1 self-start rounded-xl border border-slate-200 bg-white p-5 lg:sticky lg:top-20 lg:order-2">
          <h2 id="form-title" class="text-lg font-semibold text-slate-900">Add category</h2>

          <div id="form-error" class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>

          <form id="category-form" class="mt-4 space-y-4" novalidate>
            <div>
              <label for="name" class="form-label">Name *</label>
              <input id="name" type="text" maxlength="100" class="form-input" />
            </div>

            <div>
              <label for="slug" class="form-label">Slug</label>
              <input id="slug" type="text" maxlength="120" class="form-input" placeholder="created from the name if empty" />
            </div>

            <div>
              <label for="parent_id" class="form-label">Parent category</label>
              <select id="parent_id" class="form-input">
                <option value="">None (top-level category)</option>
              </select>
              <p id="parent-hint" class="mt-1 hidden text-xs text-slate-500">This category has sub-categories, so it stays top-level.</p>
            </div>

            <div>
              <label for="status" class="form-label">Status</label>
              <select id="status" class="form-input">
                <option value="active">Active</option>
                <option value="inactive">Inactive (hidden)</option>
              </select>
            </div>

            <div>
              <label for="description" class="form-label">Description</label>
              <textarea id="description" rows="3" maxlength="2000" class="form-input"></textarea>
            </div>

            <div class="flex gap-3">
              <button type="submit" class="btn-primary">Save Category</button>
              <button type="button" id="cancel-edit" class="btn-secondary hidden">Cancel</button>
            </div>
          </form>
        </section>

      </div>
    </main>
  </div>

  <script type="module" src="/js/admin/layout.js"></script>
  <script type="module" src="/js/admin/categories.js"></script>
</body>
</html>
