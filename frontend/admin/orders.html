<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders | Admin</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <aside id="admin-sidebar" class="bg-slate-900 md:fixed md:inset-y-0 md:left-0 md:z-30 md:w-60 md:overflow-y-auto"></aside>

  <div class="md:pl-60">
    <header id="admin-topbar" class="sticky top-0 z-20 border-b border-slate-200 bg-white"></header>

    <main class="p-4 md:p-8">
      <h1 class="text-2xl font-bold text-slate-900">Orders</h1>

      <div class="mt-6 grid gap-3 sm:grid-cols-3">
        <input id="filter-search" type="search" placeholder="Search order, name or email" class="form-input mt-0" />
        <select id="filter-status" class="form-input mt-0">
          <option value="">All order statuses</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="refunded">Refunded</option>
        </select>
        <select id="filter-payment" class="form-input mt-0">
          <option value="">All payment statuses</option>
          <option value="pending">Pending</option>
          <option value="success">Success</option>
          <option value="failed">Failed</option>
          <option value="cancelled">Cancelled</option>
          <option value="refunded">Refunded</option>
        </select>
      </div>

      <!-- Only this box scrolls (up, down and sideways). The header row stays visible. -->
      <div class="mt-4 max-h-[calc(100vh-21rem)] min-h-64 overflow-auto rounded-xl border border-slate-200 bg-white">
        <table class="min-w-full text-sm">
          <thead class="sticky top-0 z-10 bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 shadow-[0_1px_0_#e2e8f0]">
            <tr>
              <th class="px-4 py-3">Order</th>
              <th class="px-4 py-3">Customer</th>
              <th class="px-4 py-3">Total</th>
              <th class="px-4 py-3">Payment</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Date</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="order-rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <nav id="pagination" class="mt-4 flex items-center justify-center gap-3" aria-label="Pagination"></nav>
    </main>
  </div>

  <script type="module" src="/js/admin/layout.js"></script>
  <script type="module" src="/js/admin/orders.js"></script>
</body>
</html>
