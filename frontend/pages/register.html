<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | Hout Store</title>
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body
    class="flex min-h-screen flex-col bg-slate-50 text-slate-800 antialiased"
  >
    <div id="site-header" class="sticky top-0 z-40 min-h-16"></div>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
      <div
        class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"
      >
        <button type="button" data-back data-fallback="/" class="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-600 hover:text-indigo-600">&larr; Back</button>

        <div class="text-center">
          <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Create an account</h1>
          <p class="mt-2 text-base font-medium text-slate-600">
            Sign up to buy products and download your files.
          </p>
        </div>

        <div
          id="form-error"
          class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-center text-sm font-semibold text-red-700"
        ></div>

        <!-- Social sign up -->
        <div class="mt-6 space-y-3">
          <button
            type="button"
            id="google-login"
            class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-300 bg-white py-2.5 text-base font-bold text-slate-700 hover:bg-slate-50"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.46 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11A12 12 0 0 0 12 24z"/>
              <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.61H1.26A12 12 0 0 0 0 12c0 1.94.46 3.77 1.26 5.39l4.01-3.11z"/>
              <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.26 6.61l4.01 3.11C6.22 6.86 8.87 4.75 12 4.75z"/>
            </svg>
            Continue with Google
          </button>
          <button
            type="button"
            id="telegram-login"
            class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-300 bg-white py-2.5 text-base font-bold text-slate-700 hover:bg-slate-50"
          >
            <svg class="h-5 w-5" viewBox="0 0 240 240">
              <circle cx="120" cy="120" r="120" fill="#29A9EA"/>
              <path fill="#fff" d="M170 72 148 178c-2 8-7 10-14 6l-38-28-18 17c-2 2-4 4-8 4l3-40 73-66c3-3-1-4-5-2l-90 57-39-12c-8-3-8-8 2-12l153-59c7-2 13 2 11 12z"/>
            </svg>
            Continue with Telegram
          </button>
        </div>

        <div class="mt-6 flex items-center gap-3">
          <div class="h-px flex-1 bg-slate-200"></div>
          <span class="text-xs font-bold uppercase tracking-wide text-slate-400">or continue with email</span>
          <div class="h-px flex-1 bg-slate-200"></div>
        </div>

        <form id="register-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="name" class="block text-base font-bold text-slate-700"
              >Name</label
            >
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-base font-medium focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <div>
            <label for="email" class="block text-base font-bold text-slate-700"
              >Email</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-base font-medium focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <div>
            <label
              for="password"
              class="block text-base font-bold text-slate-700"
              >Password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-base font-medium focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
            <p class="mt-1 text-xs font-medium text-slate-500">
              At least 8 characters, with a letter and a number.
            </p>
          </div>
          <button
            type="submit"
            class="w-full rounded-lg bg-indigo-600 py-3 text-lg font-bold text-white hover:bg-indigo-700 disabled:opacity-60"
          >
            Create account
          </button>
        </form>

        <p class="mt-6 text-center text-base font-medium text-slate-600">
          Already have an account?
          <a href="/login" class="font-bold text-indigo-600 hover:underline"
            >Log in</a
          >
        </p>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/js/navbar.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
