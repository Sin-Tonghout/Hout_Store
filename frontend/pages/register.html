<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | Hout Store</title>
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body
    class="flex min-h-screen flex-col bg-slate-50 text-slate-800 antialiased"
  >
    <div id="site-header" class="sticky top-0 z-40 min-h-16"></div>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
      <div
        class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"
      >
              <button type="button" data-back data-fallback="/" class="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-600 hover:text-indigo-600">&larr; Back</button>
        <h1 class="text-2xl font-bold text-slate-900">Create an account</h1>
        <p class="mt-1 text-sm text-slate-600">
          Sign up to buy products and download your files.
        </p>

        <div
          id="form-error"
          class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"
        ></div>

        <form id="register-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="name" class="block text-sm font-medium text-slate-700"
              >Name</label
            >
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700"
              >Email</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-slate-700"
              >Password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
            <p class="mt-1 text-xs text-slate-500">
              At least 8 characters, with a letter and a number.
            </p>
          </div>
          <button
            type="submit"
            class="w-full rounded-lg bg-indigo-600 py-2.5 font-semibold text-white hover:bg-indigo-700 disabled:opacity-60"
          >
            Create account
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
          Already have an account?
          <a href="/login" class="font-medium text-indigo-600 hover:underline"
            >Log in</a
          >
        </p>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/js/navbar.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
