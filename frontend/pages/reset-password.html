<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | Hout Store</title>
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body
    class="flex min-h-screen flex-col bg-slate-50 text-slate-800 antialiased"
  >
    <div id="site-header" class="sticky top-0 z-40 min-h-16"></div>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
      <div
        class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"
      >
        <div class="text-center">
          <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Reset password</h1>
          <p class="mt-2 text-base font-medium text-slate-600">
            Choose a new password for your account.
          </p>
        </div>

        <div
          id="form-error"
          class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-center text-sm font-semibold text-red-700"
        ></div>

        <div id="no-token" class="mt-6 hidden text-center">
          <p class="text-base font-medium text-slate-600">
            This link is missing its reset token. Please use the link exactly as it was sent to you,
            or request a new one.
          </p>
          <a
            href="/forgot-password"
            class="mt-4 inline-block rounded-lg bg-indigo-600 px-4 py-2.5 text-base font-bold text-white hover:bg-indigo-700"
          >
            Request a new link
          </a>
        </div>

        <form id="reset-password-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="password" class="block text-base font-bold text-slate-700"
              >New password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-base font-medium focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
            <p class="mt-1 text-xs font-medium text-slate-500">
              At least 8 characters, with a letter and a number.
            </p>
          </div>
          <div>
            <label for="confirmPassword" class="block text-base font-bold text-slate-700"
              >Confirm new password</label
            >
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-base font-medium focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded-lg bg-indigo-600 py-3 text-lg font-bold text-white hover:bg-indigo-700 disabled:opacity-60"
          >
            Set new password
          </button>
        </form>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/js/navbar.js"></script>
    <script type="module" src="/js/reset-password.js"></script>
  </body>
</html>
