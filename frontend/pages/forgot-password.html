<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password | Hout Store</title>
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body
    class="flex min-h-screen flex-col bg-slate-50 text-slate-800 antialiased"
  >
    <div id="site-header" class="sticky top-0 z-40 min-h-16"></div>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
      <div
        class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"
      >
        <button type="button" data-back data-fallback="/login" class="mb-4 inline-flex items-center gap-1 text-sm font-medium text-slate-600 hover:text-indigo-600">&larr; Back</button>

        <div class="text-center">
          <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Forgot password</h1>
          <p class="mt-2 text-base font-medium text-slate-600">
            Enter your email and our team will send you a reset link.
          </p>
        </div>

        <div
          id="form-error"
          class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-center text-sm font-semibold text-red-700"
        ></div>
        <div
          id="form-success"
          class="mt-4 hidden rounded-lg border border-green-200 bg-green-50 p-3 text-center text-sm font-semibold text-green-700"
        ></div>

        <form id="forgot-password-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="email" class="block text-base font-bold text-slate-700"
              >Email</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-base font-medium focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded-lg bg-indigo-600 py-3 text-lg font-bold text-white hover:bg-indigo-700 disabled:opacity-60"
          >
            Send reset link
          </button>
        </form>

        <p class="mt-6 text-center text-base font-medium text-slate-600">
          Remembered it?
          <a href="/login" class="font-bold text-indigo-600 hover:underline"
            >Log in</a
          >
        </p>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/js/navbar.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
